name: 2 - Отправить уведомление об уроке

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        description: 'ID урока, например lesson-2. Запускайте после загрузки ДЗ, словаря и грамматики.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lesson-notification-${{ inputs.lesson_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
      LESSON_ID: ${{ inputs.lesson_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Отправить одно Telegram-уведомление об уроке
        run: node scripts/prepare-notification.mjs
