<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title">
  <title id="title">Plural ending sounds</title>
  <style>.bg{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:800 25px Arial,sans-serif;fill:#172033}.sound{font:800 30px Arial,sans-serif;fill:#334155}.word{font:21px Arial,sans-serif;fill:#24324a}.line{stroke:#dbe3ef;stroke-width:2}.badge{fill:#e2e8f0}</style>
  <rect class="bg" x="2" y="2" width="756" height="296" rx="24"/><text class="h" x="30" y="42">3.1 · Listen and repeat</text>
  <line class="line" x1="25" y1="64" x2="735" y2="64"/><line class="line" x1="25" y1="132" x2="735" y2="132"/><line class="line" x1="25" y1="200" x2="735" y2="200"/>
  <g transform="translate(30 84)"><rect class="badge" width="115" height="39" rx="12"/><text class="sound" x="24" y="30">/z/</text><text class="word" x="150" y="29">1  names · bags</text></g>
  <g transform="translate(30 152)"><rect class="badge" width="115" height="39" rx="12"/><text class="sound" x="24" y="30">/s/</text><text class="word" x="150" y="29">2  books · students</text></g>
  <g transform="translate(30 220)"><rect class="badge" width="115" height="39" rx="12"/><text class="sound" x="18" y="30">/ɪz/</text><text class="word" x="150" y="29">3  addresses · purses</text></g>
</svg>
