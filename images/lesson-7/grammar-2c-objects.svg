<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="title desc">
  <title id="title">Objects for questions and answers</title>
  <desc id="desc">A dictionary, a set of five keys, a photo, exactly three pens, an ID card, a door, a table, and two coats.</desc>
  <style>.page{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.ink{fill:none;stroke:#26364f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.shade{fill:#dbeafe;stroke:#26364f;stroke-width:4}.badge{fill:#334155}.num{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:800 25px Arial,sans-serif;fill:#172033}.tiny{font:700 14px Arial,sans-serif;fill:#26364f;text-anchor:middle}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round}</style>
  <rect class="page" width="760" height="820" rx="28"/><text class="head" x="30" y="46">2c · Write questions and answers.</text>
  <g transform="translate(30 72)">
    <!-- 1 dictionary example -->
    <g><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">1</text><path d="M101 25h132v112H101z" fill="#536987" stroke="#26364f" stroke-width="5"/><path class="ink" d="M116 25v112"/><text x="174" y="61" font-family="Arial" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">OXFORD</text><text x="174" y="84" font-family="Arial" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DICTIONARY</text><circle cx="174" cy="111" r="13" fill="none" stroke="#fff" stroke-width="3"/></g>
    <!-- 2 five keys -->
    <g transform="translate(365 0)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">2</text><circle class="shade" cx="167" cy="48" r="23"/><circle cx="167" cy="48" r="9" fill="#fff" stroke="#26364f" stroke-width="3"/><g class="ink"><circle cx="132" cy="74" r="9"/><path d="M126 82l-39 52M87 134l-11-8M95 124l-10-8"/><circle cx="150" cy="82" r="9"/><path d="M147 91l-20 58M127 149l-13-5M132 137l-12-4"/><circle cx="168" cy="85" r="9"/><path d="M168 94v58M168 152h14M168 140h11"/><circle cx="187" cy="82" r="9"/><path d="M190 91l20 58M210 149l13-5M205 137l12-4"/><circle cx="205" cy="74" r="9"/><path d="M211 82l39 52M250 134l11-8M242 124l10-8"/></g></g>
    <!-- 3 photo -->
    <g transform="translate(0 185)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">3</text><rect class="shade" x="95" y="24" width="145" height="112" rx="6"/><circle cx="167" cy="66" r="21" fill="#fff" stroke="#26364f" stroke-width="4"/><path class="ink" d="M126 122c8-39 75-39 83 0"/></g>
    <!-- 4 exactly three pens -->
    <g transform="translate(365 185)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">4</text><g transform="rotate(-18 167 82)"><path d="M81 62h173v19H81z" fill="#93c5fd" stroke="#26364f" stroke-width="4"/><path d="M81 62L54 72l27 9z" fill="#fff" stroke="#26364f" stroke-width="4"/><path d="M81 91h173v19H81z" fill="#bfdbfe" stroke="#26364f" stroke-width="4"/><path d="M81 91l-27 10 27 9z" fill="#fff" stroke="#26364f" stroke-width="4"/><path d="M81 120h173v19H81z" fill="#dbeafe" stroke="#26364f" stroke-width="4"/><path d="M81 120l-27 10 27 9z" fill="#fff" stroke="#26364f" stroke-width="4"/></g></g>
    <!-- 5 ID card -->
    <g transform="translate(0 370)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">5</text><rect class="shade" x="65" y="32" width="205" height="103" rx="8"/><circle cx="112" cy="76" r="21" fill="#fff" stroke="#26364f" stroke-width="4"/><path class="ink" d="M82 121c6-30 54-30 60 0M160 60h78M160 80h78M160 100h58"/></g>
    <!-- 6 door -->
    <g transform="translate(365 370)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">6</text><rect class="shade" x="115" y="18" width="108" height="130" rx="2"/><rect x="130" y="34" width="78" height="97" fill="#fff" stroke="#26364f" stroke-width="3"/><circle class="badge" cx="193" cy="84" r="5"/></g>
    <!-- 7 clearly shaped table -->
    <g transform="translate(0 555)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">7</text><path d="M62 43h214l-25 35H87z" fill="#dbeafe" stroke="#26364f" stroke-width="5"/><path class="ink" d="M91 78l-17 70M247 78l17 70M112 78v63M226 78v63"/></g>
    <!-- 8 two coats -->
    <g transform="translate(365 555)"><rect class="card" width="335" height="160" rx="18"/><circle class="badge" cx="24" cy="24" r="16"/><text class="num" x="24" y="30">8</text><path d="M70 50l35-24 35 24 24 88h-42l-7-54v67H95V84l-7 54H46z" fill="#94a3b8" stroke="#26364f" stroke-width="4"/><path d="M197 50l35-24 35 24 24 88h-42l-7-54v67h-20V84l-7 54h-42z" fill="#475569" stroke="#26364f" stroke-width="4"/><path class="line" d="M105 26v125M232 26v125"/><circle cx="111" cy="73" r="3" fill="#fff"/><circle cx="111" cy="92" r="3" fill="#fff"/><circle cx="238" cy="73" r="3" fill="#fff"/><circle cx="238" cy="92" r="3" fill="#fff"/></g>
  </g>
</svg>
