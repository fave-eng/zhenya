<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" role="img" aria-labelledby="title desc">
  <title id="title">Small things crossword picture clues</title>
  <desc id="desc">Fifteen numbered everyday objects. Number one is the completed watch example.</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.n{fill:#334155}.nt{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle}.icon{font:54px Apple Color Emoji,Segoe UI Emoji,sans-serif;text-anchor:middle}.label{font:700 18px Arial,sans-serif;fill:#334155;text-anchor:middle}.head{font:800 25px Arial,sans-serif;fill:#172033}.sub{font:16px Arial,sans-serif;fill:#64748b}
  </style>
  <rect class="bg" width="720" height="930" rx="28"/>
  <text class="head" x="36" y="48">1 VOCABULARY · small things</text>
  <text class="sub" x="36" y="76">Use the numbered pictures to complete the crossword.</text>
