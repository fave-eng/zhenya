<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
  <title id="title">Three scenes for this, that, these and those</title>
  <desc id="desc">Three numbered monochrome scenes: a gallery picture at a distance, a football shirt held nearby, and several T-shirts across a shop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#475569" flood-opacity=".16"/></filter>
    <style>
      .panel{fill:#fff;stroke:#dbe3ef;stroke-width:2}.num{font:700 25px system-ui,sans-serif;fill:#334155}.line{fill:none;stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#94a3b8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.fill{fill:#e2e8f0;stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dark{fill:#94a3b8;stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.black{fill:#475569}.txt{font:700 20px system-ui,sans-serif;fill:#475569}.small{font:700 17px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="760" height="1120" rx="28" fill="#f8fafc"/>
  <!-- Scene 1: gallery, picture is away from speakers -->
  <g transform="translate(26 26)">
    <rect class="panel" width="708" height="330" rx="22"/>
    <text class="num" x="20" y="40">1</text>
    <g filter="url(#shadow)">
      <path class="thin" d="M45 272h618M45 94h178M76 100v112m92-112v112"/>
      <rect class="fill" x="470" y="62" width="168" height="205" rx="4"/>
      <rect x="489" y="81" width="130" height="167" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
      <path class="thin" d="M531 221v-73m45 73v-91M510 161q32-45 64 0m-44-12q28-53 59-4"/>
      <ellipse class="dark" cx="541" cy="146" rx="10" ry="20"/><ellipse class="dark" cx="578" cy="133" rx="10" ry="23"/>
      <!-- two people at left -->
      <circle class="fill" cx="230" cy="133" r="25"/><path class="dark" d="M206 159h48l16 103h-82z"/><path class="line" d="M206 177l-45 67m92-66l55 12"/>
      <circle class="fill" cx="326" cy="139" r="25"/><path class="fill" d="M300 165h52l20 98h-88z"/><path class="line" d="M349 177l86-36"/><circle class="black" cx="435" cy="141" r="7"/>
      <path class="thin" d="M412 150l58-24"/>
    </g>
  </g>
  <!-- Scene 2: one shirt held near -->
  <g transform="translate(26 382)">
    <rect class="panel" width="708" height="330" rx="22"/>
    <text class="num" x="20" y="40">2</text>
    <g filter="url(#shadow)">
      <rect x="48" y="55" width="612" height="218" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text class="txt" x="276" y="84">FOOTBALL</text>
      <path class="thin" d="M80 115h330m-290 0v115m80-115v115m80-115v115"/>
      <path class="thin" d="M93 136h280M93 173h280M93 210h280"/>
      <!-- customer -->
      <circle class="fill" cx="155" cy="166" r="25"/><path class="dark" d="M129 193h52l24 70h-100z"/><path class="line" d="M179 206l72 4"/>
      <!-- assistant holding shirt close -->
      <circle class="fill" cx="512" cy="150" r="27"/><path class="fill" d="M484 179h58l29 84h-116z"/>
      <path class="line" d="M481 198l-62 16m99-16l-22 12"/>
      <!-- shirt between them, clearly close -->
      <g transform="translate(348 150)">
        <path class="fill" d="M36 18h56l17 14 39 20-19 37-27-15v80H26V74L0 89-19 52l39-20z"/>
        <path class="dark" d="M33 39h13v112H33zM58 39h13v112H58zM83 39h13v112H83z"/>
        <text class="small" x="54" y="98" text-anchor="middle">6</text>
      </g>
    </g>
  </g>
  <!-- Scene 3: several shirts far away -->
  <g transform="translate(26 738)">
    <rect class="panel" width="708" height="356" rx="22"/>
    <text class="num" x="20" y="40">3</text>
    <g filter="url(#shadow)">
      <rect x="48" y="54" width="612" height="246" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <!-- distant sign and rack -->
      <rect x="489" y="70" width="135" height="57" rx="7" fill="#fff" stroke="#64748b" stroke-width="3"/>
      <text class="small" x="556" y="94" text-anchor="middle">T-SHIRTS</text><text class="small" x="556" y="116" text-anchor="middle">£10 ↓</text>
      <path class="line" d="M401 157h213m-192 0v94m53-94v94m53-94v94m53-94v94"/>
      <g transform="translate(405 164) scale(.62)"><path class="fill" d="M40 15h58l18 15 38 20-20 38-27-15v78H31V73L4 88-16 50l39-20z"/></g>
      <g transform="translate(472 164) scale(.62)"><path class="dark" d="M40 15h58l18 15 38 20-20 38-27-15v78H31V73L4 88-16 50l39-20z"/></g>
      <g transform="translate(539 164) scale(.62)"><path class="fill" d="M40 15h58l18 15 38 20-20 38-27-15v78H31V73L4 88-16 50l39-20z"/></g>
      <!-- foreground people, far from shirts -->
      <circle class="fill" cx="153" cy="186" r="28"/><path class="dark" d="M124 216h58l23 84h-105z"/><path class="line" d="M179 227l84-46"/>
      <circle class="fill" cx="257" cy="181" r="27"/><path class="fill" d="M228 210h58l27 90H203z"/><path class="line" d="M281 220l72-25"/><circle class="black" cx="353" cy="195" r="6"/>
      <path class="thin" d="M290 198q60-32 112-26" stroke-dasharray="8 8"/>
    </g>
  </g>
</svg>
